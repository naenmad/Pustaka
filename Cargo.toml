[workspace]
resolver = "2"
members = [
    "crates/pustaka-core",
    "crates/pustaka-acp",
    "crates/pustaka-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pustaka Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "0.33", features = ["bundled", "uuid", "chrono"] }
pulldown-cmark = "0.13"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.32", features = ["cli", "tokio"] }
ron = "0.12"
typst = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
